version: '3.8'

services:
  db:
    image: postgres:14
    container_name: pg14-sitemadefacturacion
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    networks:
      - django-facturacion

  redis:
    container_name: redis-sistemadefacturacion
    image: redis:7-alpine
    command: redis-server --requirepass Redis2026Secure!
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - django-facturacion

  web:
    build: .
    image: vendo_sri_web
    container_name: vendo_sri_web
    # El entrypoint.sh se ejecuta primero, luego este command
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn vendo_sri.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --access-logfile /app/storage/logs/gunicorn_access.log --error-logfile /app/storage/logs/gunicorn_error.log"
    volumes:
      - .:/app
      - static_volumen:/app/staticfiles
      - media_volumen:/app/mediafiles
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - TZ=America/Guayaquil
      - REDIS_PASSWORD=Redis2026Secure!
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - django-facturacion

  celery:
    build: .
    image: vendo_sri_web
    container_name: vendo_sri_celery
    # Ruta absoluta al logfile para evitar problemas con cwd
    command: celery -A vendo_sri worker --loglevel=info --concurrency=1 --hostname=worker1@%h
    volumes:
      - .:/app
      - static_volumen:/app/staticfiles
      - media_volumen:/app/mediafiles
    depends_on:
      - db
      - redis
    environment:
      - TZ=America/Guayaquil
      - REDIS_PASSWORD=Redis2026Secure!
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - django-facturacion

  celery-beat:
    build: .
    image: vendo_sri_web
    container_name: vendo_sri_celery_beat
    # Ruta absoluta al logfile para evitar problemas con cwd
    command: celery -A vendo_sri beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
      - static_volumen:/app/staticfiles
      - media_volumen:/app/mediafiles
    depends_on:
      - db
      - redis
      - celery
    environment:
      - TZ=America/Guayaquil
      - REDIS_PASSWORD=Redis2026Secure!
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - django-facturacion

  flower:
    build: .
    image: vendo_sri_web
    container_name: vendo_sri_flower
    command: celery -A vendo_sri flower --port=5555 --broker_api=http://guest:guest@redis:6379/0
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - celery
    environment:
      - TZ=America/Guayaquil
      - REDIS_PASSWORD=Redis2026Secure!
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - django-facturacion

volumes:
  postgres_data:
  static_volumen:
  media_volumen:

networks:
  django-facturacion:
    driver: bridge
