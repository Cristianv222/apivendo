<!-- templates/custom_admin/companies/test_sri_modal.html -->
<form method="POST" action="{% url 'custom_admin:company_test_sri' company.id %}" id="testSriForm" class="needs-validation" novalidate>
    {% csrf_token %}
    
    <div id="testSriErrorContainer"></div>
    
    <div class="row g-0 modern-pos-container">
        <!-- Dashboard Sidebar: Config & Client -->
        <div class="col-md-5 border-end pos-sidebar">
            <div class="p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="pos-icon-box bg-primary-soft text-primary me-3">
                        <i class="fas fa-user-tie fs-4"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-0">Emisor & Cliente</h6>
                        <small class="text-muted">Configure el receptor</small>
                    </div>
                </div>

                <!-- Client Selector Cards -->
                <div class="client-type-selector mb-4">
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="is_final_consumer" id="type_final" value="on" checked autocomplete="off" onclick="window.toggleSriClientUI(false)">
                            <label class="btn btn-outline-light d-flex flex-column align-items-center p-3 h-100 client-card" for="type_final">
                                <i class="fas fa-users mb-2 fs-5"></i>
                                <span class="small fw-bold">Consumidor Final</span>
                            </label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="is_final_consumer" id="type_business" value="off" autocomplete="off" onclick="window.toggleSriClientUI(true)">
                            <label class="btn btn-outline-light d-flex flex-column align-items-center p-3 h-100 client-card" for="type_business">
                                <i class="fas fa-building mb-2 fs-5"></i>
                                <span class="small fw-bold">Cliente Específico</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- Detailed Client Data (Animate height/opacity) -->
                <div id="divClientData" class="client-details-pane">
                    <div class="glass-input-group mb-3">
                        <label class="form-label text-muted small mb-1">Identificación</label>
                        <div class="input-group input-group-sm">
                            <select class="form-select border-0 bg-transparent" name="customer_id_type" id="customerIdType" style="max-width: 90px;">
                                <option value="04">RUC</option>
                                <option value="05" selected>Cédula</option>
                                <option value="06">Pass</option>
                                <option value="08">ID Ext</option>
                            </select>
                            <input type="text" class="form-control border-0 bg-transparent ps-2" name="customer_id" id="customerId" placeholder="Número ID" required>
                        </div>
                    </div>

                    <div class="glass-input-group mb-3">
                        <label class="form-label text-muted small mb-1">Nombre / Razón Social</label>
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent" name="customer_name" id="customerName" placeholder="Nombre completo" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-12">
                            <div class="glass-input-group">
                                <label class="form-label text-muted small mb-1">Email</label>
                                <input type="email" class="form-control form-control-sm border-0 bg-transparent" name="customer_email" id="customerEmail" placeholder="correo@ejemplo.com">
                            </div>
                        </div>
                        <div class="col-12 mt-2">
                            <div class="glass-input-group">
                                <label class="form-label text-muted small mb-1">Dirección</label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-map-marker-alt text-muted"></i></span>
                                    <input type="text" class="form-control border-0 bg-transparent" name="customer_address" id="customerAddress" value="ECUADOR">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SRI Info -->
                <div class="mt-4 p-3 bg-light rounded-3">
                    <div class="d-flex align-items-center mb-2">
                        <i class="fas fa-info-circle text-primary me-2"></i>
                        <span class="small fw-bold">Entorno SRI</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted x-small">Ambiente:</span>
                        <span class="badge {% if company.ambiente_sri == '1' %}bg-warning{% else %}bg-success{% endif %} rounded-pill">
                            {% if company.ambiente_sri == '1' %}PRUEBAS{% else %}PRODUCCIÓN{% endif %}
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content: Product & Receipt -->
        <div class="col-md-7 pos-main-content">
            <div class="p-4 d-flex flex-column h-100">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="d-flex align-items-center">
                        <div class="pos-icon-box bg-success-soft text-success me-3">
                            <i class="fas fa-shopping-cart fs-4"></i>
                        </div>
                        <div>
                            <h6 class="fw-bold mb-0">Detalle de Venta</h6>
                            <small class="text-muted">Simulación de documentos</small>
                        </div>
                    </div>
                    <button type="button" class="btn btn-link text-muted p-0" onclick="window.resetSriForm()"><i class="fas fa-sync-alt"></i></button>
                </div>
                
                <div class="product-selection-area mb-auto">
                    <div class="glass-input-group mb-4 p-3 highlight-focus">
                        <label class="form-label text-muted small mb-2">Descripción del Producto o Servicio</label>
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent" name="product_name" id="productName" value="PRODUCTO DE PRUEBA SRI" required>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <div class="glass-input-group mb-3">
                                <label class="form-label text-muted small mb-1">Cantidad</label>
                                <input type="number" class="form-control form-control-sm border-0 bg-transparent" name="quantity" id="posQty" value="1" step="1" min="1" required oninput="window.updateSriTotals()">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="glass-input-group mb-3">
                                <label class="form-label text-muted small mb-1">P. Unitario</label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text border-0 bg-transparent text-muted">$</span>
                                    <input type="number" class="form-control border-0 bg-transparent" name="unit_price" id="posPrice" value="1.00" step="0.01" min="0.01" required oninput="window.updateSriTotals()">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="glass-input-group mb-3">
                        <label class="form-label text-muted small mb-1">Impuesto (IVA)</label>
                        <select class="form-select form-select-sm border-0 bg-transparent" name="tax_rate" id="posTax" required oninput="window.updateSriTotals()">
                            <option value="15.00" selected>IVA 15%</option>
                            <option value="12.00">IVA 12%</option>
                            <option value="0.00">IVA 0%</option>
                        </select>
                    </div>
                </div>

                <!-- Receipt View -->
                <div class="receipt-container mt-4">
                    <div class="receipt-paper">
                        <div class="receipt-dash mt-3"></div>
                        <div class="p-3">
                            <div class="receipt-row d-flex justify-content-between mb-2">
                                <span class="text-muted">Subtotal:</span>
                                <span class="fw-bold" id="lblSubtotal">$1.00</span>
                            </div>
                            <div class="receipt-row d-flex justify-content-between mb-2">
                                <span class="text-muted">IVA aplicado:</span>
                                <span class="fw-bold" id="lblIva">$0.15</span>
                            </div>
                            <div class="receipt-total d-flex justify-content-between mt-3 pt-3 border-top border-dark border-2">
                                <span class="fs-4 fw-black">TOTAL</span>
                                <span class="fs-4 fw-black text-primary" id="lblTotal">$1.15</span>
                            </div>
                        </div>
                        <div class="receipt-bottom-dash"></div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-4 d-flex gap-3">
                    <button type="button" class="btn btn-outline-secondary flex-grow-1 py-3 fs-6 rounded-4" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary flex-grow-1 py-3 fs-6 rounded-4 shadow-sm" id="btnSubmitTestSri">
                        <i class="fas fa-paper-plane me-2"></i>Emitir Documento
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>

<style>
    .modern-pos-container {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #fff;
    }
    .pos-sidebar {
        background: #f8fafc;
    }
    .pos-icon-box {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
    }
    .bg-primary-soft { background: #eff6ff; }
    .bg-success-soft { background: #f0fdf4; }
    
    .client-card {
        border-width: 2px;
        border-color: #e2e8f0;
        color: #64748b;
        transition: all 0.2s ease;
    }
    .btn-check:checked + .client-card {
        border-color: #3b82f6 !important;
        background: #eff6ff !important;
        color: #1e40af !important;
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    
    .glass-input-group {
        border-radius: 12px;
        background: #fff;
        border: 1px solid #e2e8f0;
        transition: all 0.2s;
    }
    .glass-input-group:focus-within {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .highlight-focus { background: #fdfdfd; }
    
    .client-details-pane {
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    .client-details-pane.show { /* Changed from .active to .show */
        display: block !important;
        opacity: 1;
        margin-top: 1rem;
    }

    .receipt-paper {
        background: #fff;
        position: relative;
        filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07));
    }
    .receipt-paper::before {
        content: '';
        position: absolute;
        top: -10px; left: 0; right: 0;
        height: 10px;
        background: linear-gradient(-45deg, #fff 5px, transparent 0), linear-gradient(45deg, #fff 5px, transparent 0);
        background-size: 10px 10px;
    }
    .fw-black { font-weight: 900; }
    .x-small { font-size: 0.7rem; letter-spacing: 0.05em; }
    .form-control:focus, .form-select:focus { box-shadow: none; outline: none; }
</style>

<script>
    (function() {
        const form = document.getElementById('testSriForm');
        
        window.updateSriTotals = function() {
            if (!form) return;
            const qty = parseFloat(form.querySelector('#posQty').value) || 0;
            const price = parseFloat(form.querySelector('#posPrice').value) || 0;
            const taxVal = form.querySelector('#posTax').value;
            
            let taxRate = 0;
            if (taxVal !== 'EX') {
                taxRate = parseFloat(taxVal) / 100;
            }
            
            const subtotal = qty * price;
            const iva = subtotal * taxRate;
            const total = subtotal + iva;
            
            form.querySelector('#lblSubtotal').innerText = '$' + subtotal.toLocaleString('en-US', {minimumFractionDigits: 2});
            form.querySelector('#lblIva').innerText = '$' + iva.toLocaleString('en-US', {minimumFractionDigits: 2});
            form.querySelector('#lblTotal').innerText = '$' + total.toLocaleString('en-US', {minimumFractionDigits: 2});
        };

        window.toggleSriClientUI = function(isSpecific) {
            if (!form) return;
            const divClientData = form.querySelector('#divClientData');
            const btnSubmit = form.querySelector('#btnSubmitTestSri');
            const customerId = form.querySelector('#customerId');
            const customerName = form.querySelector('#customerName');
            
            if (isSpecific) {
                divClientData.classList.add('show');
                if (customerId) customerId.required = true;
                if (customerName) customerName.required = true;
                if (btnSubmit) {
                    btnSubmit.classList.replace('btn-primary', 'btn-dark');
                    btnSubmit.innerHTML = '<i class="fas fa-file-invoice me-2"></i>Emitir Factura Real';
                }
            } else {
                divClientData.classList.remove('show');
                if (customerId) {
                    customerId.required = false;
                    customerId.value = '9999999999999';
                }
                if (customerName) {
                    customerName.required = false;
                    customerName.value = 'CONSUMIDOR FINAL';
                }
                if (btnSubmit) {
                    btnSubmit.classList.replace('btn-dark', 'btn-primary');
                    btnSubmit.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Emitir Documento de Prueba';
                }
            }
        };

        window.resetSriForm = function() {
            if (!form) return;
            form.reset();
            window.updateSriTotals();
            window.toggleSriClientUI(false);
        };

        // Init
        setTimeout(() => {
            window.updateSriTotals();
            window.toggleSriClientUI(form.querySelector('#type_business').checked);
        }, 100);
        
        console.log("SRI POS Module Bound to Window");
    })();
</script>
